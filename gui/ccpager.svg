<?xml version="1.0" encoding="UTF-8"?>
<!-- ccpager application icon: a pocket pager with a page of context on its LCD, the
     oldest lines already paged out. Drawn by hand for this project, MIT like the rest. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4652"/>
      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a6b"/>
      <stop offset="1" stop-color="#1b3049"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ebef"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
  </defs>

  <!-- The case, like the other apps -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#case)"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#11151a" stroke-width="2"/>

  <!-- Belt clip behind the pager -->
  <rect x="36" y="14" width="56" height="14" rx="5" fill="url(#clip)" stroke="#11151a" stroke-width="1.5"/>
  <rect x="50" y="19" width="28" height="4" rx="2" fill="#6b7482"/>

  <!-- The pager body -->
  <rect x="18" y="24" width="92" height="82" rx="12" fill="url(#shell)" stroke="#11151a" stroke-width="2"/>
  <rect x="21" y="27" width="86" height="76" rx="10" fill="none" stroke="#4f78a3" stroke-width="1.2" opacity="0.7"/>

  <!-- Antenna nub and the alert LED -->
  <rect x="24" y="20" width="10" height="8" rx="3" fill="#11151a"/>
  <circle cx="99" cy="36" r="3.2" fill="#ff5d4a" stroke="#11151a" stroke-width="1.2"/>
  <circle cx="98" cy="35" r="1" fill="#ffd0c8"/>

  <!-- The LCD -->
  <rect x="26" y="32" width="66" height="44" rx="4" fill="#11151a"/>
  <rect x="28" y="34" width="62" height="40" rx="3" fill="#cfe6a6"/>
  <rect x="28" y="34" width="62" height="12" rx="3" fill="#dff0bf"/>
  <rect x="28" y="43" width="62" height="3" fill="#dff0bf"/>

  <!-- The page of context on screen: the top lines paged out (stubbed, faint, struck through),
       the recent lines kept in full. -->
  <g stroke-linecap="round">
    <!-- paged out: faint stubs sliding off the left edge, with a scissor-cut rule under them -->
    <rect x="29" y="39" width="38" height="4" rx="2" fill="#7f9a62" opacity="0.5"/>
    <rect x="29" y="46" width="26" height="4" rx="2" fill="#7f9a62" opacity="0.5"/>
    <path d="M30 51.5h58" stroke="#5a7a3f" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- kept -->
    <rect x="33" y="54" width="52" height="4" rx="2" fill="#243d1e"/>
    <rect x="33" y="61" width="38" height="4" rx="2" fill="#243d1e"/>
    <rect x="33" y="68" width="46" height="4" rx="2" fill="#243d1e"/>
  </g>
  <!-- Cursor blinking at the end of the last line -->
  <rect x="82" y="67" width="3" height="6" fill="#243d1e"/>

  <!-- Buttons -->
  <rect x="26" y="83" width="30" height="12" rx="6" fill="#ffd94a" stroke="#11151a" stroke-width="1.5"/>
  <circle cx="68" cy="89" r="6" fill="#19ad9b" stroke="#11151a" stroke-width="1.5"/>
  <circle cx="84" cy="89" r="6" fill="#c9ced6" stroke="#11151a" stroke-width="1.5"/>
  <circle cx="100" cy="89" r="6" fill="#c9ced6" stroke="#11151a" stroke-width="1.5"/>
  <!-- Speaker grille -->
  <g fill="#11151a">
    <circle cx="98" cy="48" r="1.4"/><circle cx="103" cy="48" r="1.4"/>
    <circle cx="98" cy="53" r="1.4"/><circle cx="103" cy="53" r="1.4"/>
    <circle cx="98" cy="58" r="1.4"/><circle cx="103" cy="58" r="1.4"/>
  </g>
</svg>
