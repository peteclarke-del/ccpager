name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release tag
        run: ./packaging/check-release-tag.sh "${GITHUB_REF_NAME}"
      - run: npm test
      - name: Validate desktop integration
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          python3 -m py_compile gui/ccpager_gui.py
          desktop-file-validate packaging/io.github.ccpager.desktop
          appstreamcli validate --no-net packaging/io.github.ccpager.metainfo.xml

  publish:
    name: Build and publish the package
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Debian package and source archive
        run: |
          ./packaging/build-deb.sh dist
          git archive --format=tar.gz --prefix="ccpager-${GITHUB_REF_NAME#v}/" -o "dist/ccpager-${GITHUB_REF_NAME#v}-source.tar.gz" "${GITHUB_REF_NAME}"
      - name: Inspect the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          root="$(mktemp -d)"
          dpkg-deb --extract dist/*.deb "${root}"
          if find "${root}/usr" -perm /022 -print -quit | grep -q .; then
            echo "Package contains group- or world-writable files" >&2; exit 1
          fi
      - name: Install and verify the package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/ccpager
          /usr/bin/ccpager version | grep -F "${GITHUB_REF_NAME#v}"
          /usr/bin/ccpager status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.version!==process.argv[1])throw new Error("version "+j.version)})' "${GITHUB_REF_NAME#v}"
          test "$(cat /usr/lib/ccpager/package-target)" = "deb all"
      - name: Create checksums
        run: cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccpager-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "ccpager ${GITHUB_REF_NAME} for Linux"
